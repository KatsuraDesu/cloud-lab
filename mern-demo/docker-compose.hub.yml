# Triển khai từ image trên Docker Hub (không build từ source)
services:
  backend:
    image: hoangphat111/mern-backend:1.1
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    restart: unless-stopped

  frontend:
    image: hoangphat111/mern-frontend:1.1
    container_name: mern-frontend
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - BACKEND_URL=http://mern-backend:5000
    depends_on:
      - backend
    restart: unless-stopped
