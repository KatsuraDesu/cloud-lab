services:
  backend:
    build: .
    image: mern-backend
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  frontend:
    build: ./client
    image: mern-frontend
    container_name: mern-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped