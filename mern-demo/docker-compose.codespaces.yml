services:
  backend:
    image: hoangphat111/mern-backend:1.1
    container_name: mern-backend
    network_mode: host
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
    restart: unless-stopped

  frontend:
    image: hoangphat111/mern-frontend:2.0
    container_name: mern-frontend
    network_mode: host
    environment:
      - PORT=5173
      - BACKEND_URL=http://127.0.0.1:5000
    depends_on:
      - backend
    restart: unless-stopped
